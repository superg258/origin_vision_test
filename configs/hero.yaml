#enemy_color: "red"
enemy_color: "blue"

#####-----感知与模型参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolov5_model_path: assets/yolov5_0526.xml
device: CPU
threshold: 150
min_confidence: 0.8
use_traditional: true
use_roi:  false
roi:
  x: 420
  y: 200
  width: 600
  height: 600

#####-----传统检测参数-----#####
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----跟踪参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----瞄准参数-----#####
yaw_offset: -1 # degree
pitch_offset: 1.2 # degree
decision_speed: 5 # rad/s
high_speed_delay_time: 0.22 # s
low_speed_delay_time: 0.2 # s
first_tolerance: 1
second_tolerance: 1
judge_distance: 2

#####-----时序参数-----#####
timing:
  offset: -0.002 # s, 串口姿态固定时间补偿

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 2
gain: 9
vid_pid: "2bdf:0001"

