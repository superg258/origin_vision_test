 -0.9999000719197535  , -0.001943011769412539,  0.014002531204594932,
 0.                  , -0.9905094632383088  , -0.13744454603714665]
t_camera2gimbal: [0.14148643863203164, -0.00010576899333865009, 0.069536243984211155]
